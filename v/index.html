<script id="logica">
"use strict";
// ============================================================================
// A PÁGINA DO CONVIDADO (Lote 3a, 09/10/2026), e a vitrine do Drive (§15.5).
// ============================================================================
// Três modos no mesmo endereço, decididos pelo que vem depois do #:
//
//   • `e1.<evento>.<código>` ou `e1.<evento>`: a página do convidado no
//     servidor do Synova. É a MESMA leitura do app
//     (lib/core/showcase/guest_space.dart), escrita de novo em JavaScript, e
//     uma segunda implementação diverge da primeira no dia 1: por isso este
//     bloco tem um gabarito. test/core/guest_page_agreement_test.dart monta os
//     casos com o PRÓPRIO app e tool/pagina_v/conferir.mjs roda ESTE bloco no
//     Node contra eles. Os campos dos resultados têm os nomes do app.
//   • o id de um arquivo do Drive: a vitrine de sempre, para quem não usa conta
//     (invariante 14). O crachá dela também é conferido contra o app.
//   • nada: a carteira, as páginas abertas neste navegador.
//
// O QUE SAI DESTE APARELHO no modo novo: o id do evento e um ENDEREÇO de 43
// caracteres calculado do código (PBKDF2 de 20 mil voltas e HMAC), perguntados
// ao servidor do Synova sem conta (a função guest_space_get do nono SQL). O
// código nunca sai: ele chega no FRAGMENTO, que nenhum servidor recebe, nem o
// GitHub Pages. O que volta é selado (AES-GCM) com uma chave que só o código
// abre, e o servidor não consegue ler nem forjar.
//
// DUAS DIVERGÊNCIAS CONHECIDAS, as mesmas da página /c/, só para um bloco
// escrito à mão pela conta que publica (ninguém mais escreve no servidor):
// - uma versão escrita com ponto ou expoente ("v":1.0) o app lê como double e
//   recusa, e o navegador lê o número 1 e abre;
// - uma versão logo abaixo de 2^63 o app lê exata e diz "mais novo"; o
//   navegador a arredonda para 2^63 e recusa como torta.
// ============================================================================
(function () {
  const SERVIDOR = 'https://thrpjvrngwducbhsaxjy.supabase.co';
  // A chave publicável do projeto (SynovaServerConfig.publishableKey): pública
  // por desenho, viaja no app e aqui, e sem conta só alcança as funções abertas
  // a todos (aqui, guest_space_get).
  const CHAVE_PUBLICAVEL = 'sb_publishable_DQkMKepi3Ew3g-W2te9gbw_6ejgcTNC';
  // A chave de API do Drive, da vitrine de sempre. Criada em 09/09/2026,
  // restrita a `https://caioalexnes.github.io/*` e à Google Drive API (ver
  // docs/google-cloud-setup.md). Pública por desenho, como o client ID: quem a
  // protege é a restrição por REFERENCIADOR, e é por isso que esta página NÃO
  // tem a regra geral de não mandar referenciador. Só o pedido ao servidor do
  // Synova vai sem ele.
  const API_KEY = 'AIzaSyBw1prW0nnUqEXBxBQ3GRGchTRd6CBKqcg';
  const DRIVE = 'https://www.googleapis.com/drive/v3/files/';
  const MAPA = 'https://www.google.com/maps/search/?api=1&query=';
  const MARCA = 'e1';
  const FORMATO = 1;
  const TIPO_DRIVE = 'synova-showcase';
  const ESPACO_V = 1;
  const TIPO_PESSOAL = 'synova-guest';
  const TIPO_COMUM = 'synova-guest-common';
  const PBKDF2_ITER = 20000;
  const BLOCO_V = 1;
  const CODIGO_PORTA_LEN = 6;
  const CODIGO_PESSOAL_LEN = 12;
  const EXEMPLO_CODIGO = '4KP29T-XQM7HB';
  const PRAZO_MS = 30000;
  const CARTEIRA = 'synova-carteira';
  const CARTEIRA_V = 1;
  const MAX_CARTEIRA = 20;
  const MAX_CORPO = 87384;
  const MAX_TEXTO = 200;
  const ALFABETO = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  const EVENTO = /^[A-Za-z0-9_-]{1,64}$/;
  const ENDERECO = /^[A-Za-z0-9_-]{43}$/;
  const AAD_BLOCO = 'synova/guest-space/v1/block|';

  // O `trim` do Dart: o espaço do JavaScript mais o NEL (U+0085), que o Dart
  // conta como espaço e o JavaScript não.
  function aparar(s) {
    return s.replace(/^[\s\u0085]+|[\s\u0085]+$/g, '');
  }

  // Só a propriedade do PRÓPRIO objeto: um protótipo mexido por outro script
  // nunca responde no lugar do JSON.
  function proprio(o, k) {
    return Object.prototype.hasOwnProperty.call(o, k) ? o[k] : undefined;
  }

  function ehObjeto(v) {
    return typeof v === 'object' && v !== null && !Array.isArray(v);
  }

  // `is int` de um valor que veio de JSON: um número inteiro que cabe nos 64
  // bits do Dart (acima disso o Dart já o lê como double).
  function ehInteiro(v) {
    return typeof v === 'number' && Number.isInteger(v) && Math.abs(v) < 9223372036854775808;
  }

  function utf8(s) {
    return new TextEncoder().encode(s);
  }

  function subtle() {
    const c = globalThis.crypto;
    if (!c || !c.subtle) throw new Error('sem WebCrypto');
    return c.subtle;
  }

  // ------------------------------------------------------------- base64 ----

  // O decodificador de base64 do Dart (dart:convert), o mesmo da página /c/:
  // os dois alfabetos (até misturados), o preenchimento com "=" ou "%3D", e os
  // bits que sobram antes do preenchimento TÊM que ser zero. Nulo onde o Dart
  // lançaria.
  function valorBase64(c) {
    if (c >= 65 && c <= 90) return c - 65;
    if (c >= 97 && c <= 122) return c - 71;
    if (c >= 48 && c <= 57) return c + 4;
    if (c === 43 || c === 45) return 62;
    if (c === 47 || c === 95) return 63;
    if (c === 61 || c === 37) return -2;
    return -1;
  }

  function restoDoPreenchimento(s, inicio, esperado) {
    const fim = s.length;
    let p = inicio;
    if (p === fim) return esperado === 0;
    while (esperado > 0) {
      let c = s.charCodeAt(p);
      if (esperado === 3) {
        if (c === 61) {
          esperado -= 3;
          p++;
          break;
        }
        if (c !== 37) break;
        esperado--;
        p++;
        if (p === fim) break;
        c = s.charCodeAt(p);
      }
      let parcial = esperado;
      if (parcial > 3) parcial -= 3;
      if (parcial === 2) {
        if (c !== 51) break;
        p++;
        esperado--;
        if (p === fim) break;
        c = s.charCodeAt(p);
      }
      if ((c | 32) !== 100) break;
      p++;
      esperado--;
      if (p === fim) break;
    }
    return p === fim && esperado === 0;
  }

  function base64ComoDart(s) {
    const out = [];
    let bits = 0;
    let conta = 0;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      const v = valorBase64(c);
      if (v >= 0) {
        bits = ((bits << 6) | v) & 0xFFFFFF;
        conta = (conta + 1) & 3;
        if (conta === 0) {
          out.push((bits >> 16) & 255, (bits >> 8) & 255, bits & 255);
          bits = 0;
        }
        continue;
      }
      if (v === -2 && conta > 1) {
        if (conta === 3) {
          if ((bits & 3) !== 0) return null;
          out.push((bits >> 10) & 255, (bits >> 2) & 255);
        } else {
          if ((bits & 15) !== 0) return null;
          out.push((bits >> 4) & 255);
        }
        let esperado = (3 - conta) * 3;
        if (c === 37) esperado += 2;
        return restoDoPreenchimento(s, i + 1, esperado) ? Uint8Array.from(out) : null;
      }
      return null;
    }
    return conta === 0 ? Uint8Array.from(out) : null;
  }

  function paraBase64Url(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  // -------------------------------------------------------------- código ----

  // `ShowcasePass.normalize`: tira o que não é letra ou número ASCII, passa
  // para maiúscula, e o que a pessoa vai errar vira o certo ("O" é zero, "I" e
  // "L" são um). Nulo onde o app lança: o U, que o alfabeto não tem.
  function normalizar(texto) {
    const s = String(texto == null ? '' : texto).replace(/[^0-9A-Za-z]/g, '').toUpperCase();
    let out = '';
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch === 'O') out += '0';
      else if (ch === 'I' || ch === 'L') out += '1';
      else if (ALFABETO.indexOf(ch) >= 0) out += ch;
      else return null;
    }
    return out;
  }

  // `ShowcasePass.display`: dois blocos de seis.
  function exibir(codigo) {
    return codigo.length <= 6 ? codigo : codigo.substring(0, 6) + '-' + codigo.substring(6);
  }

  // `GuestSpace.parseFragment`: nulo quando o fragmento não é do modo novo (o
  // link da vitrine do Drive cai aí). Os pontos do FIM saem antes: um link
  // colado no fim de uma frase às vezes leva o ponto final junto.
  function lerFragmento(fragmento) {
    let f = String(fragmento == null ? '' : fragmento);
    if (f.startsWith('#')) f = f.substring(1);
    f = f.replace(/\.+$/, '');
    const partes = f.split('.');
    if (partes.length < 2 || partes.length > 3 || partes[0] !== MARCA) return null;
    const eventId = partes[1];
    if (!EVENTO.test(eventId)) return null;
    if (partes.length === 2) return { eventId: eventId, code: null, codeBroken: false };
    const codigo = normalizar(partes[2]);
    return codigo !== null && codigo.length === CODIGO_PESSOAL_LEN
        ? { eventId: eventId, code: codigo, codeBroken: false }
        : { eventId: eventId, code: null, codeBroken: true };
  }

  // ------------------------------------------------------------- chaves ----

  async function rotulo(mestre, nome) {
    const s = subtle();
    const k = await s.importKey('raw', mestre, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return new Uint8Array(await s.sign('HMAC', k, utf8('synova/guest-space/v1/' + nome)));
  }

  // `GuestSpace.keysFor`, sem a chave do nonce: ela é de quem sela, e quem lê
  // não precisa dela.
  async function chavesDoCodigo(codigo, eventId, iteracoes) {
    const n = normalizar(codigo);
    if (n === null) throw new Error('código com letra fora do alfabeto');
    const s = subtle();
    const material = await s.importKey('raw', utf8(n), 'PBKDF2', false, ['deriveBits']);
    const mestre = new Uint8Array(await s.deriveBits(
        {
          name: 'PBKDF2',
          salt: utf8('synova/guest-space/v1|' + eventId),
          iterations: iteracoes || PBKDF2_ITER,
          hash: 'SHA-256',
        },
        material,
        256));
    return { addr: paraBase64Url(await rotulo(mestre, 'addr')), key: await rotulo(mestre, 'key') };
  }

  // `GuestSpace.commonKeysIn`: as chaves do bloco comum DENTRO do bloco
  // pessoal. Nulo quando elas não estão lá, ou vieram tortas.
  function chavesDoComum(pessoal) {
    const c = ehObjeto(pessoal) ? proprio(pessoal, 'common') : undefined;
    if (!ehObjeto(c)) return null;
    const addr = proprio(c, 'addr');
    const key = proprio(c, 'key');
    if (typeof addr !== 'string' || typeof key !== 'string' || !ENDERECO.test(addr)) return null;
    const bytes = base64ComoDart(key);
    if (bytes === null || bytes.length !== 32) return null;
    return { addr: addr, key: bytes };
  }

  // -------------------------------------------------------------- blocos ----

  // `GuestSpace.open`: 'ok' com o conteúdo; 'chave' quando a cifra não fecha
  // (o código errado, ou o bloco de outro endereço ou de outro evento);
  // 'torto' quando não é um bloco deste tipo; 'novo' quando é de uma versão
  // mais nova que esta página.
  async function abrirBloco(chaves, eventId, corpo, tipo) {
    const bytes = typeof corpo === 'string' ? base64ComoDart(corpo) : null;
    if (bytes === null || bytes.length < 12 + 16 + 1) return { estado: 'torto' };
    let plano;
    try {
      const s = subtle();
      const k = await s.importKey('raw', chaves.key, 'AES-GCM', false, ['decrypt']);
      plano = new Uint8Array(await s.decrypt(
          {
            name: 'AES-GCM',
            iv: bytes.slice(0, 12),
            additionalData: utf8(AAD_BLOCO + eventId + '|' + chaves.addr),
            tagLength: 128,
          },
          k,
          bytes.slice(12)));
    } catch (_) {
      return { estado: 'chave' };
    }
    let m;
    try {
      // O `utf8.decode` do Dart tira UM BOM do começo, e só um (medido em
      // 09/10/2026): é o que o TextDecoder faz por padrão. Um segundo BOM, ou
      // um depois de um espaço, fica no texto, e o JSON falha dos dois lados.
      m = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(plano));
    } catch (_) {
      return { estado: 'torto' };
    }
    if (!ehObjeto(m)) return { estado: 'torto' };
    const v = proprio(m, 'v');
    if (!ehInteiro(v) || v < 1) return { estado: 'torto' };
    if (v > ESPACO_V) return { estado: 'novo' };
    if (proprio(m, 'kind') !== tipo) return { estado: 'torto' };
    return { estado: 'ok', conteudo: m };
  }

  // O pedido de UM bloco ao servidor: o evento e o endereço, e nada mais.
  function pedidoDoBloco(eventId, addr) {
    return {
      url: SERVIDOR + '/rest/v1/rpc/guest_space_get',
      headers: {
        apikey: CHAVE_PUBLICAVEL,
        Authorization: 'Bearer ' + CHAVE_PUBLICAVEL,
        'Content-Type': 'application/json',
        Accept: 'application/json',
      },
      corpo: JSON.stringify({ p_event: eventId, p_addr: addr }),
    };
  }

  // A resposta do nono SQL: achou (com o corpo), venceu, ou não achou. O
  // desfecho de erro sai do CÓDIGO, nunca da mensagem: só o SQL não aplicado
  // (PGRST202) tem frase própria, e o resto é "o servidor respondeu outra
  // coisa".
  function lerResposta(status, texto) {
    if (status >= 200 && status < 300) {
      let m;
      try {
        m = JSON.parse(texto);
      } catch (_) {
        return { estado: 'servidor' };
      }
      if (!ehObjeto(m)) return { estado: 'servidor' };
      const achou = proprio(m, 'found');
      if (achou === true) {
        const corpo = proprio(m, 'body');
        return typeof corpo === 'string' ? { estado: 'achou', corpo: corpo } : { estado: 'servidor' };
      }
      if (achou === false) {
        return proprio(m, 'expired') === true ? { estado: 'venceu' } : { estado: 'nao_achou' };
      }
      return { estado: 'servidor' };
    }
    let codigo = null;
    try {
      const m = JSON.parse(texto);
      if (ehObjeto(m)) codigo = proprio(m, 'code');
    } catch (_) {
      // Corpo que não é JSON: é como não ter código.
    }
    return { estado: codigo === 'PGRST202' ? 'nao_pronto' : 'servidor' };
  }

  async function perguntar(enviar, eventId, addr) {
    let r;
    try {
      r = await enviar(pedidoDoBloco(eventId, addr));
    } catch (_) {
      return { estado: 'offline' };
    }
    return lerResposta(r.status, r.texto);
  }

  // O pessoal aberto, e o comum que ele aponta. [guardado] é a cópia da
  // carteira, e ela só entra no lugar do COMUM, e só quando o servidor não
  // respondeu: uma resposta do servidor (não achou, venceu) nunca é trocada
  // pela cópia.
  async function abrirOsDois(eventId, chaves, corpoPessoal, enviar, guardado) {
    const p = await abrirBloco(chaves, eventId, corpoPessoal, TIPO_PESSOAL);
    if (p.estado !== 'ok') return { estado: p.estado === 'novo' ? 'novo' : 'torto' };
    const out = {
      estado: 'ok',
      pessoal: p.conteudo,
      comum: null,
      comumEstado: 'ausente',
      comumGuardado: false,
      corpoPessoal: corpoPessoal,
      corpoComum: null,
    };
    const ck = chavesDoComum(p.conteudo);
    if (ck === null) return out;
    const rc = enviar ? await perguntar(enviar, eventId, ck.addr) : { estado: 'offline' };
    let corpo;
    if (rc.estado === 'achou') {
      corpo = rc.corpo;
    } else if ((rc.estado === 'offline' || rc.estado === 'servidor') &&
        guardado && typeof guardado.comum === 'string') {
      corpo = guardado.comum;
      out.comumGuardado = true;
    } else {
      out.comumEstado = rc.estado;
      return out;
    }
    const c = await abrirBloco(ck, eventId, corpo, TIPO_COMUM);
    out.comumEstado = c.estado;
    if (c.estado === 'ok') {
      out.comum = c.conteudo;
      out.corpoComum = corpo;
    }
    return out;
  }

  function codigoValido(n, eventId) {
    return n !== null && n.length === CODIGO_PESSOAL_LEN && EVENTO.test(String(eventId));
  }

  // O caminho inteiro de um código: a chave, o bloco pessoal e o comum.
  async function abrirPagina(eventId, codigo, enviar, guardado, iteracoes) {
    const n = normalizar(codigo);
    if (!codigoValido(n, eventId)) return { estado: 'codigo' };
    const chaves = await chavesDoCodigo(n, eventId, iteracoes);
    const r = await perguntar(enviar, eventId, chaves.addr);
    if (r.estado !== 'achou') return { estado: r.estado };
    return abrirOsDois(eventId, chaves, r.corpo, enviar, guardado);
  }

  // A cópia da carteira, sem perguntar nada a ninguém: é o que abre na
  // entrada sem sinal.
  async function abrirGuardado(eventId, codigo, guardado, iteracoes) {
    const n = normalizar(codigo);
    if (!codigoValido(n, eventId) || !guardado || typeof guardado.pessoal !== 'string') {
      return { estado: 'torto' };
    }
    const chaves = await chavesDoCodigo(n, eventId, iteracoes);
    return abrirOsDois(eventId, chaves, guardado.pessoal, null, guardado);
  }

  function textos(v) {
    if (!Array.isArray(v)) return [];
    return v.filter(function (x) { return typeof x === 'string'; });
  }

  // As sessões do convidado, na ordem da programação: em quais ele entrou, e,
  // nas sessões que usam lista, se ele está nela. Numa sessão sem lista todo
  // mundo é esperado, e `esperado` é nulo: a página não diz nada.
  function minhasSessoes(pessoal, comum) {
    const lista = ehObjeto(comum) ? proprio(comum, 'sessions') : undefined;
    const sessoes = Array.isArray(lista) ? lista : [];
    const at = ehObjeto(pessoal) ? textos(proprio(pessoal, 'at')) : [];
    const exp = ehObjeto(pessoal) ? textos(proprio(pessoal, 'exp')) : [];
    const out = [];
    for (const s of sessoes) {
      if (!ehObjeto(s)) continue;
      const id = proprio(s, 'id');
      if (typeof id !== 'string') continue;
      out.push({
        id: id,
        entrou: at.indexOf(id) >= 0,
        esperado: proprio(s, 'list') === true ? exp.indexOf(id) >= 0 : null,
      });
    }
    return out;
  }

  // `ShowcasePass.unpackMatrix`: [versão][lado][bits], e o tamanho tem que
  // fechar. Nulo onde o app lançaria.
  function matrizDeBytes(b) {
    if (!b || b.length < 2 || b[0] !== BLOCO_V) return null;
    const lado = b[1];
    if (lado <= 0 || lado > 177) return null;
    if (b.length !== 2 + Math.floor((lado * lado + 7) / 8)) return null;
    return { lado: lado, bits: b };
  }

  function lerMatriz(b64) {
    return typeof b64 === 'string' ? matrizDeBytes(base64ComoDart(b64)) : null;
  }

  function escuro(m, linha, coluna) {
    const i = linha * m.lado + coluna;
    return ((m.bits[2 + (i >> 3)] >> (7 - (i & 7))) & 1) === 1;
  }

  // O `double.toString` do Dart: o mesmo do JavaScript, menos o número
  // inteiro, que o Dart escreve com ".0" (e o zero negativo com o sinal). O
  // JSON canônico grava -16.0 como -16, e o app monta o link a partir do
  // double.
  function numeroComoDart(x) {
    if (Object.is(x, -0)) return '-0.0';
    const s = String(x);
    return Number.isInteger(x) && s.indexOf('e') < 0 ? s + '.0' : s;
  }

  // O link do mapa (`GeoPoint.webUrl`), ou nulo quando o local veio torto.
  function mapa(local) {
    if (!ehObjeto(local)) return null;
    const lat = proprio(local, 'lat');
    const lon = proprio(local, 'lon');
    if (typeof lat !== 'number' || typeof lon !== 'number' || !isFinite(lat) || !isFinite(lon) ||
        Math.abs(lat) > 90 || Math.abs(lon) > 180) {
      return null;
    }
    return MAPA + numeroComoDart(lat) + ',' + numeroComoDart(lon);
  }

  // ------------------------------------------------------------ carteira ----

  // A CARTEIRA: as páginas abertas neste navegador, para abrir de novo sem
  // digitar e sem internet. Mora no localStorage (a tela lê e grava); estas
  // funções só decidem o que entra e o que sai, e nunca lançam.
  //
  // Uma entrada por CONVIDADO de um evento, e não por código: o código novo
  // de quem teve o código trocado substitui o antigo, que não abre mais nada.
  function carteiraVazia() {
    return { v: CARTEIRA_V, itens: [] };
  }

  function textoCurto(t) {
    return typeof t === 'string' ? t.substring(0, MAX_TEXTO) : '';
  }

  function itemValido(i) {
    if (!ehObjeto(i)) return null;
    const e = proprio(i, 'e');
    const g = proprio(i, 'g');
    const c = proprio(i, 'c');
    const em = proprio(i, 'em');
    if (typeof e !== 'string' || !EVENTO.test(e)) return null;
    if (typeof g !== 'string' || !EVENTO.test(g)) return null;
    if (typeof c !== 'string' || normalizar(c) !== c || c.length !== CODIGO_PESSOAL_LEN) return null;
    if (!ehInteiro(em) || em < 0) return null;
    const out = { e: e, g: g, c: c, n: textoCurto(proprio(i, 'n')), ev: textoCurto(proprio(i, 'ev')), em: em };
    const bp = proprio(i, 'bp');
    const bc = proprio(i, 'bc');
    if (typeof bp === 'string' && bp.length <= MAX_CORPO) out.bp = bp;
    if (typeof bc === 'string' && bc.length <= MAX_CORPO) out.bc = bc;
    return out;
  }

  function carteiraLer(texto) {
    if (typeof texto !== 'string' || texto === '') return carteiraVazia();
    let m;
    try {
      m = JSON.parse(texto);
    } catch (_) {
      return carteiraVazia();
    }
    if (!ehObjeto(m) || proprio(m, 'v') !== CARTEIRA_V) return carteiraVazia();
    const itens = proprio(m, 'itens');
    if (!Array.isArray(itens)) return carteiraVazia();
    const out = [];
    const vistos = new Set();
    for (const bruto of itens) {
      const i = itemValido(bruto);
      if (i === null) continue;
      const k = i.e + '|' + i.g;
      if (vistos.has(k)) continue;
      vistos.add(k);
      out.push(i);
      if (out.length >= MAX_CARTEIRA) break;
    }
    return { v: CARTEIRA_V, itens: out };
  }

  // O mais recente vai na frente, e o que passa do teto sai pelo fim.
  function carteiraGuardar(carteira, item) {
    const i = itemValido(item);
    if (i === null) return carteira;
    const resto = carteira.itens.filter(function (x) { return !(x.e === i.e && x.g === i.g); });
    return { v: CARTEIRA_V, itens: [i].concat(resto).slice(0, MAX_CARTEIRA) };
  }

  function carteiraEsquecer(carteira, e, g) {
    return {
      v: CARTEIRA_V,
      itens: carteira.itens.filter(function (x) { return !(x.e === e && x.g === g); }),
    };
  }

  function carteiraAchar(carteira, e, c) {
    for (const x of carteira.itens) {
      if (x.e === e && x.c === c) return x;
    }
    return null;
  }

  function carteiraDoEvento(carteira, e) {
    return carteira.itens.filter(function (x) { return x.e === e; });
  }

  // Para caber no armazenamento do navegador: tira os corpos guardados dos [n]
  // itens mais antigos. Eles continuam na carteira, e abrem com internet.
  function carteiraAliviar(carteira, n) {
    const corte = carteira.itens.length - n;
    return {
      v: CARTEIRA_V,
      itens: carteira.itens.map(function (x, idx) {
        if (idx < corte) return x;
        return { e: x.e, g: x.g, c: x.c, n: x.n, ev: x.ev, em: x.em };
      }),
    };
  }

  function carteiraTexto(carteira) {
    return JSON.stringify(carteira);
  }

  // ------------------------------------------------------- vitrine do Drive --

  function idDoDrive(fragmento) {
    return aparar(String(fragmento == null ? '' : fragmento).replace(/^#/, ''));
  }

  function pedidoDrive(id, agora) {
    return DRIVE + encodeURIComponent(id) + '?alt=media&key=' + API_KEY + '&t=' + agora;
  }

  // O arquivo da vitrine. O prazo é respeitado AQUI também, e não só pelo app
  // que apaga o arquivo (`Showcase.isExpired`): se o dono nunca mais abrir o
  // app, o arquivo continua no Drive, e a data dentro dele é o que vale.
  function lerArquivoDrive(status, texto, agora) {
    if (status === 404 || status === 403) return { estado: 'sumiu' };
    if (!(status >= 200 && status < 300)) return { estado: 'erro', status: status };
    let d;
    try {
      d = JSON.parse(texto);
    } catch (_) {
      return { estado: 'torto' };
    }
    if (!ehObjeto(d) || proprio(d, 'kind') !== TIPO_DRIVE) return { estado: 'torto' };
    const v = proprio(d, 'v');
    if (typeof v === 'number' && v > FORMATO) return { estado: 'novo' };
    const ate = proprio(d, 'expiresAt');
    if (ehInteiro(ate) && agora > ate) return { estado: 'venceu', ate: ate };
    return { estado: 'ok', dados: d };
  }

  // O crachá da vitrine do Drive (`ShowcasePass.open`): UMA derivação do
  // código, e o bloco de cada convidado tentado com ela. O sal leva o evento e
  // o AAD leva o convidado: é o AAD que separa uma pessoa da outra.
  async function abrirCrachaDrive(codigo, eventId, badges, iteracoes) {
    if (!ehObjeto(badges) || Object.keys(badges).length === 0) return { estado: 'sem_crachas' };
    const n = normalizar(codigo);
    if (n === null || n === '') return { estado: 'nenhum' };
    const s = subtle();
    const material = await s.importKey('raw', utf8(n), 'PBKDF2', false, ['deriveKey']);
    const chave = await s.deriveKey(
        {
          name: 'PBKDF2',
          salt: utf8('synova/showcase-pass/v1|' + eventId),
          iterations: iteracoes || PBKDF2_ITER,
          hash: 'SHA-256',
        },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']);
    for (const id of Object.keys(badges)) {
      const corpo = proprio(badges, id);
      const bruto = typeof corpo === 'string' ? base64ComoDart(corpo) : null;
      if (bruto === null || bruto.length < 12 + 16) continue;
      let plano;
      try {
        plano = new Uint8Array(await s.decrypt(
            {
              name: 'AES-GCM',
              iv: bruto.slice(0, 12),
              additionalData: utf8('showcase|' + eventId + '|' + id),
            },
            chave,
            bruto.slice(12)));
      } catch (_) {
        // Chave errada para ESTE bloco: segue para o próximo. É o caso normal
        // 249 vezes em 250.
        continue;
      }
      // A VERSÃO DO BLOCO conferida antes de desenhar: um bloco de um app mais
      // novo para aqui, e não vira um desenho errado na tela de quem vai entrar.
      if (plano[0] !== BLOCO_V) return { estado: 'novo' };
      const m = matrizDeBytes(plano);
      return m ? { estado: 'ok', guestId: id, matriz: m } : { estado: 'torto' };
    }
    return { estado: 'nenhum' };
  }

  // O que a pessoa pôs no campo da presença: 'qr', 'porta', 'pessoal', 'id',
  // ou '' quando não há nada. O código da porta e o pessoal são reconhecidos
  // pelo TAMANHO (os do app, `ShortCode.length` e `ShowcasePass.codeLength`).
  //
  // POR QUE EXISTE (campo, 11/09/2026): um convidado digitou no campo da
  // presença o código impresso no crachá, e a página respondeu "confira se o
  // crachá é deste evento". Era deste evento. O código da porta não pode abrir
  // esta página, porque ele é a entrada da pessoa e o arquivo é público; mas a
  // página pode reconhecê-lo e dizer o que fazer.
  function tipoDaEntrada(texto) {
    const t = aparar(String(texto == null ? '' : texto));
    if (!t) return '';
    if (t.toUpperCase().startsWith('SYN')) return 'qr';
    const n = normalizar(t);
    if (n !== null && n.length === CODIGO_PORTA_LEN) return 'porta';
    if (n !== null && n.length === CODIGO_PESSOAL_LEN) return 'pessoal';
    return 'id';
  }

  // O identificador do convidado, do QR inteiro (`SYN1.<evento>.<id>.<mac>`, e
  // o id viaja em claro nele) ou colado sozinho. O MAC não é usado aqui.
  function identificador(texto) {
    const t = aparar(String(texto == null ? '' : texto));
    if (!t) return '';
    const partes = t.split('.');
    if (partes.length >= 3 && partes[0].toUpperCase().startsWith('SYN')) return partes[2];
    return t;
  }

  // --------------------------------------------------------------- datas ----

  // `lib/views/shared/when.dart`, na hora local, igual nas duas línguas.
  function p2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function hhmm(ms) {
    const d = new Date(ms);
    return p2(d.getHours()) + ':' + p2(d.getMinutes());
  }

  function diaHhmm(ms) {
    const d = new Date(ms);
    return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + ' ' + hhmm(ms);
  }

  function dia(ms) {
    const d = new Date(ms);
    return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  function quando(ms) {
    return dia(ms) + ' ' + hhmm(ms);
  }

  // `sessionRange`: o dia só aparece quando ele MUDA a informação.
  function faixa(de, ate) {
    const a = typeof de === 'number' ? de : null;
    const b = typeof ate === 'number' ? ate : null;
    if (a === null && b === null) return null;
    if (a === null) return '→ ' + diaHhmm(b);
    if (b === null) return diaHhmm(a) + ' →';
    const x = new Date(a);
    const y = new Date(b);
    const mesmoDia = x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() &&
        x.getDate() === y.getDate();
    return mesmoDia ? diaHhmm(a) + ' → ' + hhmm(b) : diaHhmm(a) + ' → ' + diaHhmm(b);
  }

  // `AppLocale.fromCodes`: o primeiro português ou inglês da lista decide, e
  // o padrão é o inglês.
  function linguaDe(lista) {
    for (const bruto of lista || []) {
      const t = aparar(String(bruto));
      let corte = t.length;
      for (let i = 0; i < t.length; i++) {
        if (t[i] === '_' || t[i] === '-') {
          corte = i;
          break;
        }
      }
      const l = t.substring(0, corte).toLowerCase();
      if (l === 'pt') return 'pt';
      if (l === 'en') return 'en';
    }
    return 'en';
  }

<script>
"use strict";
// A TELA: só desenha o que a lógica (o bloco de cima) respondeu. Texto de fora
// (o nome, as sessões, os avisos, as células) entra por textContent, nunca como
// HTML. Nada é escrito no console do navegador.
(function () {
  const V = globalThis.SynovaVitrine;
  const K = V.constantes;
  const preferidas = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || ''];
  const lingua = V.linguaDe(preferidas);
  const T = V.TEXTOS[lingua];
  const $ = function (id) { return document.getElementById(id); };

  document.documentElement.lang = lingua === 'pt' ? 'pt-BR' : 'en';
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];
  $('codigoNovo').placeholder = T.pgExemplo.replace('@@', K.EXEMPLO_CODIGO);
  $('codigoDrive').placeholder = T.pgExemplo.replace('@@', K.EXEMPLO_CODIGO);

  // A PÁGINA ABRE NA ENTRADA MESMO SEM INTERNET: o service worker (sw.js, que
  // só cuida da navegação para cá) guarda a última versão desta página, e a
  // carteira guarda o que ela abriu.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
  }

  // Quanto o pedido do segundo toque espera: o bastante para ler o botão e
  // tocar de novo, e curto para não deixar um esquecer armado na tela.
  const ESQUECER_MS = 4000;

  const CARDS = ['esperando', 'erro', 'nota', 'cCodigo', 'cQr', 'cMinhas', 'cProg', 'cAvisos',
    'cLocal', 'cGuardada', 'cCarteira', 'cIntro', 'dCracha', 'dEu', 'dTabela'];

  // Cada abertura leva um número: a resposta de uma anterior que chega depois
  // não apaga a de agora.
  let vez = 0;
  let eventoDoCodigo = null;
  let atual = null;
  let dados = null;
  let desarmarEsquecer = function () {};

  function mostrar(id, sim) {
    $(id).classList.toggle('hide', !sim);
  }

  function limpar() {
    for (const id of CARDS) mostrar(id, false);
    for (const id of ['qr', 'minhas', 'prog', 'avisos', 'carteira', 'qrDrive', 'eu', 'tabela']) {
      $(id).replaceChildren();
    }
    for (const id of ['erro', 'nota', 'codigoAviso', 'qrDriveAviso', 'omitidos']) $(id).textContent = '';
    mostrar('omitidos', false);
    desarmarEsquecer();
    atual = null;
    dados = null;
  }

  function cabecalho(titulo, sub) {
    $('titulo').textContent = titulo;
    $('sub').textContent = sub || '';
    document.title = titulo ? titulo + ' · Synova' : 'Synova';
  }

  function erro(texto) {
    $('erro').textContent = texto;
    mostrar('erro', !!texto);
  }

  function nota(texto) {
    $('nota').textContent = texto;
    mostrar('nota', !!texto);
  }

  function esperando(texto) {
    $('esperandoTexto').textContent = texto || '';
    mostrar('esperando', !!texto);
  }

  // ESQUECER PEDE DOIS TOQUES. Ele apaga a cópia que abre SEM internet, e um
  // toque errado na porta de um evento, sem rede, deixaria a pessoa sem o QR.
  // O primeiro toque só pede o segundo, e o pedido some sozinho. Sem caixa do
  // sistema: o navegador embutido de um app de conversa pode não mostrar o
  // confirm(), e aí esquecer nunca funcionaria. O segundo toque só vale para
  // a MESMA página do primeiro.
  function doisToques(botao, rotulo, chave, acao) {
    let armado = null;
    let qual = null;
    function desarmar() {
      if (armado !== null) clearTimeout(armado);
      armado = null;
      qual = null;
      botao.textContent = rotulo();
    }
    botao.addEventListener('click', function () {
      const k = chave();
      if (k === null) return desarmar();
      if (armado === null || qual !== k) {
        if (armado !== null) clearTimeout(armado);
        qual = k;
        botao.textContent = T.pgEsquecerDeNovo;
        armado = setTimeout(desarmar, ESQUECER_MS);
        return;
      }
      desarmar();
      acao();
    });
    return desarmar;
  }

  function enviar(p) {
    const ctrl = new AbortController();
    const prazo = setTimeout(function () { ctrl.abort(); }, K.PRAZO_MS);
    return fetch(p.url, {
      method: 'POST',
      headers: p.headers,
      body: p.corpo,
      signal: ctrl.signal,
      cache: 'no-store',
      credentials: 'omit',
      referrerPolicy: 'no-referrer',
      mode: 'cors',
    }).then(async function (r) {
      return { status: r.status, texto: await r.text() };
    }).finally(function () { clearTimeout(prazo); });
  }

  // ----------------------------------------------------------- a carteira ----

  // O armazenamento pode faltar (navegação anônima, cota cheia): a carteira
  // vazia é o pior que acontece, e a página continua abrindo com internet.
  function lerCarteira() {
    try {
      return V.carteiraLer(localStorage.getItem(K.CARTEIRA));
    } catch (_) {
      return V.carteiraLer(null);
    }
  }

  function gravarCarteira(carteira) {
    for (let n = 0; n <= carteira.itens.length; n++) {
      try {
        localStorage.setItem(K.CARTEIRA, V.carteiraTexto(V.carteiraAliviar(carteira, n)));
        return true;
      } catch (_) {
        // Sem espaço: tenta de novo sem os corpos dos mais antigos.
      }
    }
    return false;
  }

  // ------------------------------------------------------------- o desenho ----

  // A margem clara em volta (quiet zone) NÃO é enfeite: sem ela a câmera não
  // acha o código. E o fundo é branco SEMPRE, e não a cor do tema: um QR
  // invertido não é lido.
  function desenharQr(m) {
    const quiet = 4;
    const total = m.lado + quiet * 2;
    const escala = Math.max(3, Math.floor(280 / total));
    const cv = document.createElement('canvas');
    cv.width = cv.height = total * escala;
    cv.style.width = cv.style.height = (total * escala) + 'px';
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#000000';
    for (let r = 0; r < m.lado; r++) {
      for (let c = 0; c < m.lado; c++) {
        if (V.escuro(m, r, c)) ctx.fillRect((c + quiet) * escala, (r + quiet) * escala, escala, escala);
      }
    }
    return cv;
  }

  function texto(v) {
    return typeof v === 'string' ? v : '';
  }

  function linha(nome, detalhe, direita, classe) {
    const l = document.createElement('div');
    l.className = 'sess';
    const esq = document.createElement('span');
    esq.className = 'nome';
    esq.textContent = nome;
    if (detalhe) {
      const d = document.createElement('span');
      d.className = 'det';
      d.textContent = detalhe;
      esq.append(d);
    }
    l.append(esq);
    if (direita) {
      const dir = document.createElement('span');
      dir.className = classe || 'when';
      dir.textContent = direita;
      l.append(dir);
    }
    return l;
  }

  function sessoesDe(origem) {
    const s = origem && Array.isArray(origem.sessions) ? origem.sessions : [];
    return s.filter(function (x) { return x && typeof x === 'object'; });
  }

  function desenharProgramacao(sessoes) {
    if (!sessoes.length) return;
    for (const s of sessoes) {
      const porta = texto(s.door);
      $('prog').append(linha(texto(s.name), porta ? T.pgEntrada.replace('@@', porta) : '',
          V.faixa(s.from, s.to) || ''));
    }
    mostrar('cProg', true);
  }

  function desenharAvisos(avisos, omitidos) {
    const lista = Array.isArray(avisos) ? avisos.filter(function (a) { return a && typeof a === 'object'; }) : [];
    if (!lista.length) return;
    // Do mais novo para o mais velho: quem abre no meio do evento quer o que
    // acabou de acontecer.
    for (const a of lista.slice().reverse()) {
      const bloco = document.createElement('div');
      bloco.className = 'aviso';
      const t = document.createElement('span');
      t.textContent = texto(a.text);
      const h = document.createElement('span');
      h.className = 'when';
      h.textContent = typeof a.at === 'number' ? V.diaHhmm(a.at) : '';
      bloco.append(t, h);
      $('avisos').append(bloco);
    }
    if (typeof omitidos === 'number' && omitidos > 0) {
      $('omitidos').textContent = omitidos === 1 ? T.pgOmitido1 : T.pgOmitidos.replace('@@', String(omitidos));
      mostrar('omitidos', true);
    }
    mostrar('cAvisos', true);
  }

  // ---------------------------------------------------------- o modo novo ----

  function desenharPagina(r, eventId, codigo) {
    limpar();
    const p = r.pessoal;
    const c = r.comum;
    atual = { eventId: eventId, codigo: codigo, guestId: texto(p.guestId) };
    cabecalho(texto(p.event) || (c && texto(c.event)) || T.pgTituloPadrao,
        T.pgDe.replace('@@', texto(p.name)));

    const m = V.lerMatriz(p.badge);
    if (m) {
      $('qr').append(desenharQr(m));
      mostrar('cQr', true);
    }

    if (c) {
      const porId = {};
      for (const s of sessoesDe(c)) if (typeof s.id === 'string') porId[s.id] = s;
      for (const x of V.minhasSessoes(p, c)) {
        const s = porId[x.id];
        let estado = '';
        let classe = 'estado no';
        if (x.entrou) {
          estado = T.pgEntrou;
          classe = 'estado yes';
        } else if (x.esperado === true) {
          estado = T.pgNaLista;
        } else if (x.esperado === false) {
          estado = T.pgForaDaLista;
          classe = 'estado fora';
        }
        $('minhas').append(linha(texto(s && s.name), V.faixa(s && s.from, s && s.to) || '', estado, classe));
      }
      if ($('minhas').childElementCount) mostrar('cMinhas', true);
      desenharProgramacao(sessoesDe(c));
      desenharAvisos(c.announcements, c.omitted);
      const link = V.mapa(c.venue);
      if (link) {
        $('mapa').href = link;
        mostrar('cLocal', true);
      }
    }

    const partes = [];
    const mudou = Math.max(typeof p.changedAt === 'number' ? p.changedAt : 0,
        c && typeof c.changedAt === 'number' ? c.changedAt : 0);
    if (mudou > 0) partes.push(T.pgAtualizada.replace('@@', V.quando(mudou)));
    if (c && typeof c.until === 'number') partes.push(T.pgAte.replace('@@', V.dia(c.until)));
    $('privacidade').textContent = [partes.join(' '), T.pgPrivacidade].filter(Boolean).join(' ');
    mostrar('cGuardada', true);
  }

  function notaDoComum(r) {
    if (r.comumGuardado) nota(T.pgComumDaCopia);
    else if (!r.comum && r.comumEstado !== 'ausente') nota(T.pgComumFalta);
  }

  function guardar(eventId, codigo, r) {
    const p = r.pessoal;
    const carteira = V.carteiraGuardar(lerCarteira(), {
      e: eventId,
      g: p.guestId,
      c: codigo,
      n: p.name,
      ev: p.event,
      em: Date.now(),
      bp: r.corpoPessoal,
      bc: r.corpoComum,
    });
    gravarCarteira(carteira);
  }

  async function abrir(eventId, codigo, minha) {
    const guardadoItem = V.carteiraAchar(lerCarteira(), eventId, codigo);
    const guardado = guardadoItem ? { pessoal: guardadoItem.bp, comum: guardadoItem.bc } : null;
    let mostrouCopia = false;
    // NA ENTRADA, A CÓPIA PRIMEIRO: quem tem a página guardada vê o QR na hora,
    // e a versão nova chega por cima quando o servidor responder.
    if (guardadoItem && typeof guardadoItem.bp === 'string') {
      try {
        const rg = await V.abrirGuardado(eventId, codigo, guardado);
        if (minha !== vez) return;
        if (rg.estado === 'ok') {
          desenharPagina(rg, eventId, codigo);
          nota(T.pgAtualizando);
          mostrouCopia = true;
        }
      } catch (_) {
        // Sem WebCrypto, a resposta de baixo diz.
      }
    }
    if (!mostrouCopia) {
      cabecalho(T.pgTituloPadrao, '');
      esperando(T.pgAbrindo);
    }
    let r;
    try {
      r = await V.abrirPagina(eventId, codigo, enviar, guardado);
    } catch (_) {
      r = { estado: 'semConta' };
    }
    if (minha !== vez) return;
    esperando(null);
    if (r.estado === 'ok') {
      desenharPagina(r, eventId, codigo);
      notaDoComum(r);
      guardar(eventId, codigo, r);
      return;
    }
    // SÓ O QUE O SERVIDOR DIZ DESTA PÁGINA tira a cópia da tela: o código não
    // abre mais nada (a organização o trocou) ou o prazo acabou. O resto é o
    // servidor falhando (fora do ar, "ainda não está pronto", um bloco que não
    // fecha a conta), e a cópia já foi conferida pela cifra quando foi
    // guardada: na entrada, sem ela, a pessoa ficaria sem o QR por um defeito
    // que não é dela.
    if (mostrouCopia && r.estado !== 'nao_achou' && r.estado !== 'venceu') {
      nota(r.estado === 'novo' ? T.pgNovo : T.pgDaCopia.replace('@@', V.quando(guardadoItem.em)));
      return;
    }
    limpar();
    cabecalho(T.pgTituloPadrao, '');
    $('privacidade').textContent = T.pgPrivacidade;
    const frases = {
      codigo: T.pgCodigoCurto,
      nao_achou: T.pgNaoAbre,
      venceu: T.pgVenceu,
      nao_pronto: T.pgNaoPronto,
      servidor: T.pgServidor,
      offline: T.pgOffline,
      torto: T.pgTorto,
      novo: T.pgNovo,
      semConta: T.pgSemConta,
    };
    erro(frases[r.estado] || T.pgServidor);
    if (r.estado === 'codigo' || r.estado === 'nao_achou') pedirCodigo(eventId, '');
    if (guardadoItem && (r.estado === 'nao_achou' || r.estado === 'venceu')) {
      atual = { eventId: eventId, codigo: codigo, guestId: guardadoItem.g };
      mostrar('cGuardada', true);
    }
  }

  function pedirCodigo(eventId, aviso) {
    eventoDoCodigo = eventId;
    $('codigoAviso').textContent = aviso || '';
    mostrar('cCodigo', true);
  }

  function enviarCodigo() {
    if (!eventoDoCodigo) return;
    const bruto = $('codigoNovo').value;
    // O LINK INTEIRO colado no campo também serve. O endereço desta página
    // passa a ser o link do EVENTO, sem o código: a página nunca põe o código
    // no histórico do navegador por conta própria.
    const corte = bruto.indexOf('#');
    if (corte >= 0) {
      const link = V.lerFragmento(bruto.substring(corte));
      if (link && link.code) {
        history.replaceState(null, '', '#' + K.MARCA + '.' + link.eventId);
        const minha = ++vez;
        limpar();
        abrir(link.eventId, link.code, minha);
        return;
      }
    }
    const n = V.normalizar(bruto);
    if (n !== null && n.length === K.CODIGO_PORTA_LEN) {
      $('codigoAviso').textContent = T.pgCodigoPorta;
      return;
    }
    if (n === null || n.length !== K.CODIGO_PESSOAL_LEN) {
      $('codigoAviso').textContent = T.pgCodigoCurto;
      return;
    }
    const minha = ++vez;
    const eventId = eventoDoCodigo;
    limpar();
    abrir(eventId, n, minha);
  }

  function desenharCarteira(itens, eventoUnico) {
    $('carteira').replaceChildren();
    for (const i of itens) {
      const b = document.createElement('div');
      b.className = 'item';
      const nome = document.createElement('div');
      nome.className = 'forte';
      nome.textContent = eventoUnico ? i.n : [i.n, i.ev].filter(Boolean).join(' · ');
      const em = document.createElement('div');
      em.className = 'when';
      em.textContent = T.pgCarteiraEm.replace('@@', V.quando(i.em));
      const acoes = document.createElement('div');
      acoes.className = 'acoes';
      const abrirB = document.createElement('button');
      abrirB.type = 'button';
      abrirB.textContent = T.pgCarteiraAbrir;
      abrirB.addEventListener('click', function () {
        // O endereço passa a ser o link do EVENTO, sem o código: ele não vai
        // para o histórico do navegador por um toque aqui.
        history.replaceState(null, '', '#' + K.MARCA + '.' + i.e);
        const minha = ++vez;
        limpar();
        abrir(i.e, i.c, minha);
      });
      const esquecerB = document.createElement('button');
      esquecerB.type = 'button';
      esquecerB.className = 'leve';
      esquecerB.textContent = T.pgCarteiraEsquecer;
      doisToques(esquecerB, function () { return T.pgCarteiraEsquecer; },
          function () { return i.e + '|' + i.g; }, function () {
            gravarCarteira(V.carteiraEsquecer(lerCarteira(), i.e, i.g));
            carregar();
          });
      acoes.append(abrirB, esquecerB);
      b.append(nome, em, acoes);
      $('carteira').append(b);
    }
    mostrar('cCarteira', itens.length > 0);
  }

  async function modoNovo(link, minha) {
    $('privacidade').textContent = T.pgPrivacidade;
    if (link.code) return abrir(link.eventId, link.code, minha);
    const doEvento = V.carteiraDoEvento(lerCarteira(), link.eventId);
    // O link do EVENTO com UMA página guardada dele abre direto: é o caso de
    // quem já abriu o link pessoal aqui e volta pelo do evento.
    if (!link.codeBroken && doEvento.length === 1) return abrir(link.eventId, doEvento[0].c, minha);
    cabecalho(T.pgTituloPadrao, '');
    if (link.codeBroken) erro(T.pgLinkCortado);
    pedirCodigo(link.eventId, '');
    desenharCarteira(doEvento, true);
  }

  function modoCarteira() {
    cabecalho(T.pgTituloPadrao, '');
    $('privacidade').textContent = T.pgPrivacidade;
    const itens = lerCarteira().itens;
    desenharCarteira(itens, false);
    mostrar('cIntro', itens.length === 0);
  }

  // -------------------------------------------------------- o modo do Drive --

  async function modoDrive(id, minha) {
    cabecalho(T.pgVitrine, T.pgCarregando);
    $('privacidade').textContent = T.pgDrivePrivacidade;
    let resposta;
    try {
      // O referenciador vai, de propósito: é ele que a chave de API do Drive
      // confere.
      const r = await fetch(V.pedidoDrive(id, Date.now()), { cache: 'no-store', credentials: 'omit' });
      resposta = { status: r.status, texto: await r.text() };
    } catch (_) {
      resposta = null;
    }
    if (minha !== vez) return;
    $('sub').textContent = '';
    if (!resposta) return erro(T.pgDriveOffline);
    const a = V.lerArquivoDrive(resposta.status, resposta.texto, Date.now());
    if (a.estado === 'sumiu') return erro(T.pgDriveSumiu);
    if (a.estado === 'erro') return erro(T.pgDriveErro.replace('@@', String(a.status)));
    if (a.estado === 'torto') return erro(T.pgDriveTorto);
    if (a.estado === 'novo') return erro(T.pgDriveNovo);
    if (a.estado === 'venceu') return erro(T.pgDriveVenceu.replace('@@', V.dia(a.ate)));
    dados = a.dados;
    desenharDrive();
  }

  function desenharDrive() {
    const nome = texto(dados.event) || T.pgVitrine;
    cabecalho(nome, typeof dados.publishedAt === 'number'
        ? T.pgConteudoDe.replace('@@', V.diaHhmm(dados.publishedAt)) : '');
    const sessoes = sessoesDe(dados);
    desenharProgramacao(sessoes);
    desenharAvisos(dados.announcements, 0);

    // O CRACHÁ SÓ APARECE quando o arquivo traz blocos: um campo pedindo
    // código numa vitrine sem crachás faria a pessoa procurar um código que
    // ninguém mandou.
    if (dados.badges && typeof dados.badges === 'object' && Object.keys(dados.badges).length) {
      mostrar('dCracha', true);
      // O código volta preenchido de quem já abriu neste navegador.
      try {
        const salvo = localStorage.getItem('synova-codigo-' + texto(dados.eventId));
        if (salvo && !$('codigoDrive').value) $('codigoDrive').value = salvo;
      } catch (_) {
        // Sem armazenamento, a pessoa digita.
      }
    }
    mostrar('dEu', true);

    const colunas = Array.isArray(dados.columns) ? dados.columns : [];
    const convidados = Array.isArray(dados.guests) ? dados.guests : [];
    if (colunas.length && convidados.length) desenharTabela(colunas, convidados, sessoes);
  }

  function desenharTabela(colunas, convidados, sessoes) {
    const t = $('tabela');
    const cabeca = t.insertRow();
    for (const c of colunas) {
      const th = document.createElement('th');
      th.textContent = texto(c && c.name);
      cabeca.append(th);
    }
    for (const s of sessoes) {
      const th = document.createElement('th');
      th.textContent = texto(s.name);
      cabeca.append(th);
    }
    for (const g of convidados) {
      if (!g || typeof g !== 'object') continue;
      const l = t.insertRow();
      for (const c of colunas) {
        const v = g.cells && c && typeof c.id === 'string' ? g.cells[c.id] : '';
        l.insertCell().textContent = texto(v);
      }
      for (const s of sessoes) {
        const td = l.insertCell();
        const veio = Array.isArray(g.at) && g.at.includes(s.id);
        td.textContent = veio ? '✓' : '·';
        td.className = veio ? 'yes' : 'no';
      }
    }
    mostrar('dTabela', true);
  }

  async function mostrarCrachaDrive() {
    const alvo = $('qrDrive');
    const aviso = $('qrDriveAviso');
    alvo.replaceChildren();
    aviso.textContent = '';
    if (!dados) return;
    const bruto = $('codigoDrive').value;
    if (!V.normalizar(bruto)) return;
    aviso.textContent = T.pgCrachaAbrindo;
    let r;
    try {
      r = await V.abrirCrachaDrive(bruto, texto(dados.eventId), dados.badges);
    } catch (_) {
      aviso.textContent = T.pgCrachaSemConta;
      return;
    }
    if (r.estado === 'ok') {
      alvo.append(desenharQr(r.matriz));
      aviso.textContent = T.pgCrachaMostre;
      // O código fica guardado neste navegador, e só nele: a pessoa não digita
      // de novo na entrada.
      try {
        localStorage.setItem('synova-codigo-' + texto(dados.eventId), V.normalizar(bruto));
      } catch (_) {
        // Sem armazenamento, a pessoa digita de novo.
      }
      return;
    }
    aviso.textContent = r.estado === 'novo' ? T.pgCrachaNovo
        : r.estado === 'sem_crachas' ? T.pgCrachaSemCrachas : T.pgCrachaNenhum;
  }

  function minhaPresencaDrive() {
    const alvo = $('eu');
    alvo.replaceChildren();
    if (!dados) return;
    const entrada = $('cracha').value;
    const tipo = V.tipoDaEntrada(entrada);
    if (!tipo) return;
    if (tipo === 'porta') {
      alvo.textContent = T.pgEuPorta;
      return;
    }
    if (tipo === 'pessoal') {
      alvo.textContent = dados.badges ? T.pgEuPessoalComCracha : T.pgEuPessoalSemCracha;
      return;
    }
    const id = V.identificador(entrada);
    const g = (Array.isArray(dados.guests) ? dados.guests : []).find(function (x) {
      return x && x.id === id;
    });
    if (!g) {
      alvo.textContent = T.pgEuNaoAchou;
      return;
    }
    const sessoes = sessoesDe(dados);
    if (!sessoes.length) {
      alvo.textContent = T.pgEuSemSessoes;
      return;
    }
    for (const s of sessoes) {
      const veio = Array.isArray(g.at) && g.at.includes(s.id);
      alvo.append(linha(texto(s.name), '', veio ? T.pgEuCompareceu : '·', veio ? 'yes' : 'no'));
    }
  }

  // ---------------------------------------------------------------- o fio ----

  async function carregar() {
    const minha = ++vez;
    limpar();
    eventoDoCodigo = null;
    const frag = location.hash || '';
    const link = V.lerFragmento(frag);
    if (link) return modoNovo(link, minha);
    // Um link do modo novo cortado antes do evento: um id do Drive nunca tem
    // ponto, e nunca é só a marca.
    const cru = V.idDoDrive(frag);
    if (cru === K.MARCA || cru.startsWith(K.MARCA + '.')) {
      cabecalho(T.pgTituloPadrao, '');
      $('privacidade').textContent = T.pgPrivacidade;
      return erro(T.pgLinkSemEvento);
    }
    const id = cru;
    if (id) return modoDrive(id, minha);
    if (frag.length > 1) {
      cabecalho(T.pgVitrine, '');
      return erro(T.pgDriveIncompleto);
    }
    return modoCarteira();
  }

  // Os listeners ficam FORA do desenho: religá-los a cada abertura faria o
  // toque disparar em duplicata (o defeito que a página de convite já teve).
  $('abrirNovo').addEventListener('click', enviarCodigo);
  $('codigoNovo').addEventListener('keydown', function (e) { if (e.key === 'Enter') enviarCodigo(); });
  desarmarEsquecer = doisToques($('esquecer'), function () { return T.pgEsquecer; },
      function () { return atual ? atual.eventId + '|' + atual.guestId : null; }, function () {
        gravarCarteira(V.carteiraEsquecer(lerCarteira(), atual.eventId, atual.guestId));
        mostrar('cGuardada', false);
        nota(T.pgEsquecida);
      });
  $('abrirDrive').addEventListener('click', mostrarCrachaDrive);
  $('codigoDrive').addEventListener('keydown', function (e) { if (e.key === 'Enter') mostrarCrachaDrive(); });
  $('ver').addEventListener('click', minhaPresencaDrive);
  $('cracha').addEventListener('keydown', function (e) { if (e.key === 'Enter') minhaPresencaDrive(); });

  // Trocar só o fragmento NÃO recarrega a página: a outra lição da página de
  // convite, onde o segundo link mostrava o código do primeiro.
  window.addEventListener('hashchange', carregar);
  carregar();
})();
</script>
</body>
